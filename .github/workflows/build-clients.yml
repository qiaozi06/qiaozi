name: Build Native Clients

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'windows/**'
      - 'macos/**'
      - 'common/**'
      - '.github/workflows/build-clients.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Report Android build log
        if: failure()
        run: |
          tail -n 10 "$RUNNER_TEMP/android-build.log" 2>/dev/null | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows Agent
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-static-windows-ixws12-openssl36-json312

      - name: Install dependencies (vcpkg, static)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          vcpkg install ixwebsocket:x64-windows-static nlohmann-json:x64-windows-static openssl:x64-windows-static 2>&1 |
            Tee-Object -FilePath build-logs/vcpkg.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install depot_tools
        shell: pwsh
        run: |
          if (-not (Test-Path C:\depot_tools\gclient.bat)) {
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Sync libwebrtc source (M120 / branch-heads/6099)
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
          GYP_MSVS_VERSION: '2022'
        run: |
          New-Item -ItemType Directory -Force -Path C:\webrtc | Out-Null
          Set-Location C:\webrtc
          if (-not (Test-Path C:\webrtc\src\.git)) {
            cmd /c "fetch --nohooks --no-history webrtc 2>&1" | Tee-Object -FilePath C:\webrtc\fetch.log
            if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\fetch.log -Tail 30; exit 1 }
          }
          Set-Location C:\webrtc\src
          git fetch --depth 1 origin branch-heads/6099 2>&1 | Tee-Object -FilePath C:\webrtc\fetch-branch.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\fetch-branch.log -Tail 30; exit 1 }
          git checkout -f FETCH_HEAD 2>&1 | Tee-Object -FilePath C:\webrtc\checkout.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\checkout.log -Tail 30; exit 1 }
          cmd /c "gclient sync -D --no-history 2>&1" | Tee-Object -FilePath C:\webrtc\sync.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\sync.log -Tail 60; exit 1 }

      - name: Restore prebuilt libwebrtc
        id: webrtc-cache
        uses: actions/cache@v4
        with:
          path: C:\webrtc\src\out\Release\obj\webrtc.lib
          key: libwebrtc-branch-heads-6099-static-mt-lib-v1

      - name: Build libwebrtc (static, ~2h)
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
          GYP_MSVS_VERSION: '2022'
        run: |
          Set-Location C:\webrtc\src
          gn gen out/Release --args="is_debug=false is_component_build=false rtc_build_examples=false rtc_build_tools=false rtc_include_tests=false rtc_enable_protobuf=false use_rtti=true symbol_level=0 enable_libaom=false enable_dav1d_decode=false" 2>&1 |
            Tee-Object -FilePath C:\webrtc\gn.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\gn.log -Tail 30; exit 1 }
          ninja -C out/Release webrtc 2>&1 | Tee-Object -FilePath C:\webrtc\ninja.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\webrtc\ninja.log -Tail 60; exit 1 }

      - name: Locate libwebrtc
        shell: pwsh
        run: |
          $lib = "C:\webrtc\src\out\Release\obj\webrtc.lib"
          if (-not (Test-Path $lib)) {
            $found = Get-ChildItem C:\webrtc\src\out\Release -Recurse -Filter webrtc.lib -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) { Write-Error "webrtc.lib not found"; exit 1 }
            New-Item -ItemType Directory -Force -Path (Split-Path $lib) | Out-Null
            Copy-Item $found.FullName $lib
          }
          Get-Item $lib | Select-Object FullName, Length

      - name: Configure
        shell: pwsh
        run: |
          $inc = "C:/webrtc/src;C:/webrtc/src/third_party/abseil-cpp;C:/webrtc/src/third_party/libyuv/include;C:/webrtc/src/third_party/boringssl/src/include"
          cmake -S windows -B build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DWEBRTC_LIB="C:/webrtc/src/out/Release/obj/webrtc.lib" `
            "-DWEBRTC_INCLUDE=$inc" 2>&1 |
            Tee-Object -FilePath build-logs/cmake-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-win --config Release 2>&1 |
            Tee-Object -FilePath build-logs/cmake-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows build log
        if: failure()
        shell: pwsh
        run: |
          $log = "build-logs/cmake-build.log"
          if (Test-Path $log) {
            $hits = Select-String -Path $log -Pattern 'error C\d|error LNK\d|fatal error|CMake Error' -Context 0,2 |
              Select-Object -First 15
            foreach ($h in $hits) {
              Write-Host ("::error::" + ($h.Line -replace '%','%25'))
              foreach ($c in $h.Context.PostContext) { Write-Host ("::error::  " + ($c -replace '%','%25')) }
            }
            Write-Host "---- cmake-build.log tail ----"
            Get-Content $log -Tail 40
          }

      - name: Upload Windows build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: build-win/Release/crossremote-agent.exe
          if-no-files-found: error

  macos:
    name: macOS Agent
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Fetch WebRTC xcframework
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/WebRTC.xcframework.zip" \
            https://github.com/webrtc-sdk/Specs/releases/download/144.7559.15/WebRTC.xcframework.zip
          unzip -q "$RUNNER_TEMP/WebRTC.xcframework.zip" -d "$RUNNER_TEMP/webrtc"
          find "$RUNNER_TEMP/webrtc" -maxdepth 4 -name "WebRTC.framework" -o -maxdepth 2 -name "*.xcframework"

      - name: Build app bundle
        working-directory: macos
        run: |
          set -o pipefail
          WEBRTC_FW=$(find "$RUNNER_TEMP/webrtc" -maxdepth 4 -type d -name "WebRTC.framework" | grep -m1 "macos" || true)
          if [ -z "$WEBRTC_FW" ]; then
            WEBRTC_FW=$(find "$RUNNER_TEMP/webrtc" -maxdepth 4 -type d -name "WebRTC.framework" | head -n1)
          fi
          echo "WEBRTC_FW=$WEBRTC_FW"
          make bundle \
            WEBRTC_DIR="$(dirname "$WEBRTC_FW")" \
            OPENSSL_PREFIX="$(brew --prefix openssl@3)" 2>&1 | tee "$RUNNER_TEMP/macos-build.log"

      - name: Report macOS build log
        if: failure()
        run: |
          grep -n -E "error:" "$RUNNER_TEMP/macos-build.log" 2>/dev/null | head -n 10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done || true
          tail -n 3 "$RUNNER_TEMP/macos-build.log" 2>/dev/null | sed 's/%/%25/g' | while IFS= read -r l; do echo "::warning::$l"; done || true

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent macos/CrossRemote.app CrossRemote-macos.zip

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: CrossRemote-macos.zip
          if-no-files-found: error

name: Build Native Clients

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'windows/**'
      - 'macos/**'
      - 'common/**'
      - '.github/workflows/build-clients.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows Agent
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (vcpkg, static)
        shell: pwsh
        run: |
          vcpkg install ixwebsocket:x64-windows-static nlohmann-json:x64-windows-static openssl:x64-windows-static

      - name: Configure
        shell: pwsh
        run: |
          cmake -S windows -B build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: build-win/Release/crossremote-agent.exe
          if-no-files-found: error

  macos:
    name: macOS Agent
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Fetch WebRTC xcframework
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/WebRTC.xcframework.zip" \
            https://github.com/webrtc-sdk/Specs/releases/download/144.7559.15/WebRTC.xcframework.zip
          unzip -q "$RUNNER_TEMP/WebRTC.xcframework.zip" -d "$RUNNER_TEMP/webrtc"

      - name: Build app bundle
        working-directory: macos
        run: |
          make bundle \
            WEBRTC_DIR="$RUNNER_TEMP/webrtc/WebRTC.xcframework/macos-arm64_x86_64" \
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent macos/CrossRemote.app CrossRemote-macos.zip

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: CrossRemote-macos.zip
          if-no-files-found: error
